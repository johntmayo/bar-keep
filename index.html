    tailwind.config = {

        extend: {
          colors: {
            ink: {
              950: 'var(--bg-primary)',
              900: 'var(--bg-secondary)',
              850: 'var(--bg-tertiary)',
              800: '#374151',
              700: 'var(--border)',

              500: 'var(--text-secondary)',
              400: 'var(--text-secondary)',

              200: 'var(--text-primary)',

            },
            copper: {

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-primary: #0c0a09;
      --bg-secondary: #1c1917;
      --bg-tertiary: #292524;
      --text-primary: #d6d3d1;
      --text-secondary: #a8a29e;
      --text-muted: #78716c;
      --border: #374151;
      --accent: #a16207;
    }

    [data-theme="light"] {
      --bg-primary: #faf8f5;
      --bg-secondary: #f5f1ec;
      --bg-tertiary: #ede8e1;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --accent: #a16207;
    }

    html {
      background-color: var(--bg-primary);
    }
    body {
      font-family: 'JetBrains Mono', 'Courier New', 'Monaco', 'Menlo', 'Consolas', monospace;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-weight: 400;
      overscroll-behavior: none;
      margin: 0;
      padding: 0;
    }
    .font-display { font-family: 'JetBrains Mono', 'Courier New', 'Monaco', 'Menlo', 'Consolas', monospace; }
    
    /* Subtle texture */
    .paper-texture::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.012;
      pointer-events: none;
      z-index: 9999;
    }
    
    /* Minimal styling for any remaining cards */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    . { animation: fadeIn 0.2s ease; }
    . { animation: slideUp 0.3s ease; }
    . { animation: slideDown 0.3s ease; }
    . { animation: scaleIn 0.2s ease; }
    .animate-pulse { animation: pulse 2s ease infinite; }
    
    /* Staggered grid animation */
    .stagger-item { opacity: 0; animation: slideUp 0.4s ease forwards; }
    .stagger-item:nth-child(1)  { animation-delay: 0ms; }
    .stagger-item:nth-child(2)  { animation-delay: 30ms; }
    .stagger-item:nth-child(3)  { animation-delay: 55ms; }
    .stagger-item:nth-child(4)  { animation-delay: 80ms; }
    .stagger-item:nth-child(5)  { animation-delay: 105ms; }
    .stagger-item:nth-child(6)  { animation-delay: 130ms; }
    .stagger-item:nth-child(7)  { animation-delay: 155ms; }
    .stagger-item:nth-child(8)  { animation-delay: 175ms; }
    .stagger-item:nth-child(9)  { animation-delay: 195ms; }
    .stagger-item:nth-child(10) { animation-delay: 210ms; }
    .stagger-item:nth-child(11) { animation-delay: 225ms; }
    .stagger-item:nth-child(12) { animation-delay: 240ms; }
    .stagger-item:nth-child(n+13) { animation-delay: 250ms; }
    
    /* Focus & inputs */
    input:focus, textarea:focus, select:focus, button:focus-visible { outline: none; }
    .input-field {
      background: transparent;
      border: 1px solid var(--border);
    }
    .input-field:focus {
      border-color: var(--border);
    }
    .input-field::placeholder { color: #57534e; }
    
    /* Buttons - plain text links only */
    .btn-copper {
      color: var(--accent);
    }
    .btn-copper:hover {
      color: var(--text-primary);
    }
    
    /* Star rating */
    .star-rating { display: inline-flex; gap: 1px; }
    .star { cursor: pointer; transition: all 0.15s ease; }
    .star:hover { transform: scale(1.15); }
    
    /* Toast */
    @keyframes toastIn { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(100%); } }
    .toast-enter { animation: toastIn 0.3s ease; }
    .toast-exit { animation: toastOut 0.3s ease forwards; }
    
    /* Bottom nav for mobile */
    @media (max-width: 640px) {
      .mobile-bottom-nav {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
    }
    
    /* iOS standalone */
    @media all and (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); }
      .mobile-bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
    }
    
    /* Missing ingredient callout - smaller and lighter */
    .missing-count-callout {
      font-size: 0.625rem; /* Smaller than text-2xs */
      color: #57534e; /* Lighter gray than text-ink-500 */
      font-weight: 400;
      line-height: 1;
    }
    
    [data-theme="light"] .missing-count-callout {
      color: #9ca3af; /* Lighter gray for light theme */
    }
    
    /* Substitute asterisk bullet - smaller and properly aligned */
    .substitute-bullet {
      display: inline-block;
      width: 0.375rem; /* Match w-1.5 (6px) */
      height: 0.375rem; /* Match h-1.5 (6px) */
      line-height: 0.375rem;
      text-align: center;
      font-size: 0.5rem; /* Smaller asterisk */
      font-weight: 400; /* Remove font-medium */
      color: #78716c; /* text-ink-500 equivalent */
      flex-shrink: 0;
    }
    
    [data-theme="light"] .substitute-bullet {
      color: #6b7280; /* text-ink-500 for light theme */
    }

    .onboarding-shell {
      background:
        radial-gradient(circle at top left, rgba(161, 98, 7, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(148, 163, 184, 0.12), transparent 28%),
        linear-gradient(180deg, rgba(28, 25, 23, 0.92), rgba(12, 10, 9, 0.98));
    }

    [data-theme="light"] .onboarding-shell {
      background:
        radial-gradient(circle at top left, rgba(161, 98, 7, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(120, 113, 108, 0.08), transparent 28%),
        linear-gradient(180deg, rgba(250, 248, 245, 0.98), rgba(245, 241, 236, 0.98));
    }

    .onboarding-card {
      background: color-mix(in srgb, var(--bg-secondary) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
      backdrop-filter: blur(18px);
    }

    .onboarding-halo {
      box-shadow: 0 0 0 1px rgba(212, 165, 116, 0.14), 0 28px 80px rgba(0, 0, 0, 0.32);
    }

    .onboarding-dots {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 9999px;
      transition: all 0.18s ease;
    }
  </style>
  <script>
    // Set initial theme immediately to avoid flash
    (function() {
      try {
        const saved = localStorage.getItem('theme-preference');
        const theme = saved || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        // Also set a default background color immediately
        document.documentElement.style.backgroundColor = theme === 'light' ? '#ffffff' : '#0c0a09';
        document.body.style.backgroundColor = theme === 'light' ? '#ffffff' : '#0c0a09';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#ffffff';
        if (document.body) {
          document.body.style.backgroundColor = '#ffffff';
        }
      }
    })();
  </script>
</head>
<body class="min-h-screen paper-texture">
  <div id="root"></div>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker available
                    window.dispatchEvent(new CustomEvent('sw-update', { detail: newWorker }));
                  }
                });
              }
            });
            
            // Check for updates every hour
            setInterval(() => {
              registration.update();
            }, 3600000);
          })
          .catch(e => console.log('SW failed:', e));
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ============ UTILITIES ============
    
    // Ingredient normalization utility
    let ingredientAliasMap = null;
    let unmatchedIngredients = new Set();
    
    const normalizeIngredientKey = (name) => {
      if (!name || typeof name !== 'string') return '';
      return name
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/&/g, ' and ')
        .replace(/[.,;:!?'"()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    };
    
    const buildIngredientAliasMap = (ingredientsDb) => {
      if (ingredientAliasMap) return ingredientAliasMap;
      if (!ingredientsDb) return {};
      
      const map = {};
      ingredientsDb.categories?.forEach(cat => {
        cat.subcategories?.forEach(sub => {
          sub.items?.forEach(item => {
            const canonical = normalizeIngredientKey(item.name);
            // Map canonical name to itself
            map[canonical] = canonical;
            // Map aliases to canonical name
            if (item.aliases && Array.isArray(item.aliases)) {
              item.aliases.forEach(alias => {
                map[normalizeIngredientKey(alias)] = canonical;
              });
            }
          });
        });
      });
      ingredientAliasMap = map;
      return map;
    };
    
    const normalizeIngredient = (name, ingredientsDb) => {
      if (!name || typeof name !== 'string') return name;
      
      // Build alias map if needed
      const aliasMap = buildIngredientAliasMap(ingredientsDb);
      
      let normalized = normalizeIngredientKey(name);
      
      // Look up in alias map
      if (aliasMap[normalized]) {
        return aliasMap[normalized];
      }
      
      // If not found, track for debugging and return normalized version
      unmatchedIngredients.add(name);
      return normalized;
    };
    
    // Find ingredient details in ingredientsDb (category, subcategory, item)
    const findIngredientInDb = (canonicalName, ingredientsDb) => {
      if (!ingredientsDb || !canonicalName) return null;
      
      for (const category of ingredientsDb.categories || []) {
        for (const subcategory of category.subcategories || []) {
          for (const item of subcategory.items || []) {
            const itemCanonical = normalizeIngredient(item.name, ingredientsDb);
            if (itemCanonical === canonicalName || 
                item.aliases?.some(alias => normalizeIngredient(alias, ingredientsDb) === canonicalName)) {
              return { category, subcategory, item };
            }
          }
        }
      }
      return null;
    };
    
    // Smart ingredient matching - handles brand names like "Dolin Dry Vermouth" → "Dry Vermouth"
    const findBestIngredientMatch = (scannedName, ingredientsDb) => {
      if (!scannedName || !ingredientsDb) return null;
      
      const normalizedScanned = normalizeIngredient(scannedName, ingredientsDb);
      
      // First, try exact canonical match
      let bestMatch = null;
      let bestMatchScore = 0;
      
      ingredientsDb.categories?.forEach(cat => {
        cat.subcategories?.forEach(sub => {
          sub.items?.forEach(item => {
            const itemCanonical = normalizeIngredient(item.name, ingredientsDb);
            
            // Exact match
            if (itemCanonical === normalizedScanned) {
              bestMatch = item.name;
              bestMatchScore = 100;
              return;
            }
            
            // Check aliases
            if (item.aliases) {
              const aliasMatch = item.aliases.some(alias => 
                normalizeIngredient(alias, ingredientsDb) === normalizedScanned
              );
              if (aliasMatch) {
                bestMatch = item.name;
                bestMatchScore = 95;
                return;
              }
            }
            
            // Partial match: scanned name contains canonical name (e.g., "Dolin Dry Vermouth" contains "Dry Vermouth")
            if (normalizedScanned.includes(itemCanonical) && itemCanonical.length >= 3) {
              const score = (itemCanonical.length / normalizedScanned.length) * 80;
              if (score > bestMatchScore) {
                bestMatch = item.name;
                bestMatchScore = score;
              }
            }
            
            // Reverse partial match: canonical name contains scanned name (e.g., for abbreviations)
            if (itemCanonical.includes(normalizedScanned) && normalizedScanned.length >= 3) {
              const score = (normalizedScanned.length / itemCanonical.length) * 70;
              if (score > bestMatchScore) {
                bestMatch = item.name;
                bestMatchScore = score;
              }
            }
          });
        });
      });
      
      // Only return match if score is high enough (avoid false positives)
      return bestMatchScore >= 60 ? bestMatch : null;
    };

    // Get multiple ingredient suggestions for a scanned name (returns array sorted by relevance)
    const getIngredientSuggestions = (scannedName, ingredientsDb, maxSuggestions = 5) => {
      if (!scannedName || !ingredientsDb) return [];
      
      const normalizedScanned = normalizeIngredient(scannedName, ingredientsDb);
      const suggestions = [];
      
      ingredientsDb.categories?.forEach(cat => {
        cat.subcategories?.forEach(sub => {
          sub.items?.forEach(item => {
            const itemCanonical = normalizeIngredient(item.name, ingredientsDb);
            let score = 0;
            
            // Exact match
            if (itemCanonical === normalizedScanned) {
              score = 100;
            }
            // Check aliases
            else if (item.aliases) {
              const aliasMatch = item.aliases.some(alias => 
                normalizeIngredient(alias, ingredientsDb) === normalizedScanned
              );
              if (aliasMatch) {
                score = 95;
              }
            }
            // Partial match: scanned name contains canonical name
            else if (normalizedScanned.includes(itemCanonical) && itemCanonical.length >= 3) {
              score = (itemCanonical.length / normalizedScanned.length) * 80;
            }
            // Reverse partial match: canonical name contains scanned name
            else if (itemCanonical.includes(normalizedScanned) && normalizedScanned.length >= 3) {
              score = (normalizedScanned.length / itemCanonical.length) * 70;
            }
            // Fuzzy match: check if words overlap
            else {
              const scannedWords = normalizedScanned.split(/\s+/);
              const itemWords = itemCanonical.split(/\s+/);
              const matchingWords = scannedWords.filter(word => 
                word.length >= 3 && itemWords.some(iw => iw.includes(word) || word.includes(iw))
              );
              if (matchingWords.length > 0) {
                score = (matchingWords.length / Math.max(scannedWords.length, itemWords.length)) * 50;
              }
            }
            
            if (score >= 40) {
              suggestions.push({ name: item.name, score });
            }
          });
        });
      });
      
      // Sort by score descending and return top suggestions with scores
      return suggestions
        .sort((a, b) => b.score - a.score)
        .slice(0, maxSuggestions);
    };
    
    // Get substitution group for a base spirit ingredient
    // Returns null if not eligible for substitution
    // 
    // Substitution rules (conservative):
    // - Only applies to "Spirits" category
    // - Approved groups: Whiskey, Gin, Rum, Vodka, Brandy, Tequila (not Mezcal)
    // - Does NOT substitute across groups (e.g., Gin ↔ Vodka)
    // - Does NOT substitute non-spirits (liqueurs, amari, vermouth, etc.)
    //
    // Test cases (expected behavior):
    // - Recipe: Dark Rum, Inventory: White Rum → CAN MAKE (substitution)
    // - Recipe: Rye Whiskey, Inventory: Bourbon → CAN MAKE (substitution)
    // - Recipe: Tequila Blanco, Inventory: Mezcal → NOT CAN MAKE (different groups)
    // - Recipe: Absinthe, Inventory: Aquavit → NOT CAN MAKE (other spirits, no substitution)
    const getSubstitutionGroup = (canonicalName, ingredientsDb) => {
      const info = findIngredientInDb(canonicalName, ingredientsDb);
      if (!info) return null;
      
      // Only allow substitutions for "Spirits" category
      if (info.category.name !== 'Spirits') return null;
      
      const subcatName = info.subcategory.name.toLowerCase();
      const subcatId = info.subcategory.id.toLowerCase();
      
      // Approved substitution groups
      if (subcatId === 'whiskey' || subcatName.includes('whiskey') || subcatName.includes('whisky')) {
        return 'whiskey';
      }
      if (subcatId === 'gin' || subcatName.includes('gin')) {
        return 'gin';
      }
      if (subcatId === 'rum' || subcatName.includes('rum')) {
        return 'rum';
      }
      if (subcatId === 'vodka' || subcatName.includes('vodka')) {
        return 'vodka';
      }
      if (subcatId === 'brandy' || subcatName.includes('brandy')) {
        return 'brandy';
      }
      
      // Tequila & Mezcal: only allow substitution within tequila variants (not mezcal)
      if (subcatId === 'agave' || subcatName.includes('tequila') || subcatName.includes('mezcal')) {
        const itemName = info.item.name.toLowerCase();
        const itemId = info.item.id.toLowerCase();
        // Check if it's a tequila (not mezcal, sotol, raicilla, etc.)
        if (itemId.includes('tequila') || (itemName.includes('tequila') && !itemName.includes('mezcal'))) {
          return 'tequila';
        }
      }
      
      return null; // No substitution allowed for other spirits
    };
    
    // Find an acceptable substitute for an ingredient from inventory
    const findSubstitute = (requiredCanonical, inventory, ingredientsDb) => {
      const group = getSubstitutionGroup(requiredCanonical, ingredientsDb);
      if (!group) return null;
      
      // Find first matching ingredient from same substitution group in inventory
      for (const invItem of inventory) {
        const invItemCanonical = normalizeIngredient(invItem.name, ingredientsDb);
        const invGroup = getSubstitutionGroup(invItemCanonical, ingredientsDb);
        if (invGroup === group) {
          return { substitute: invItem.name, substituteCanonical: invItemCanonical };
        }
      }
      
      return null;
    };
    
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          ref.current.appendChild(lucide.createElement(lucide.icons[name]));
        }
      }, [name]);
      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
    };

    const StarRating = ({ rating = 0, onRate, size = "text-sm", readonly = false }) => {
      const [hover, setHover] = useState(0);
      return (
        <div className="star-rating">
          {[1, 2, 3, 4, 5].map((star) => (
            <span
              key={star}
              className={`star ${size} ${(hover || rating) >= star ? 'text-copper' : 'text-ink-700'} ${readonly ? 'cursor-default' : ''}`}
              onMouseEnter={() => !readonly && setHover(star)}
              onMouseLeave={() => !readonly && setHover(0)}
              onClick={() => !readonly && onRate?.(star)}
            >★</span>
          ))}
        </div>
      );
    };

    const storage = {
      get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
      set: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { console.error(e); } }
    };

    // ============ TOAST SYSTEM ============
    
    const ToastContext = React.createContext();
    
    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);
      
      const addToast = useCallback((message, type = 'default') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type, exiting: false }]);
        setTimeout(() => {
          setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
          setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 300);
        }, 2500);
      }, []);
      
      return (
        <ToastContext.Provider value={addToast}>
          {children}
          <div className="fixed bottom-20 sm:bottom-6 left-4 right-4 sm:left-auto sm:right-6 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(toast => (
              <div
                key={toast.id}
                className={`${toast.exiting ? 'toast-exit' : 'toast-enter'} px-4 py-3 bg-ink-900 border border-ink-700 flex items-center gap-3 pointer-events-auto`}
              >
                {toast.type === 'success' && <Icon name="Check" className="w-4 h-4 text-emerald-400" />}
                {toast.type === 'error' && <Icon name="X" className="w-4 h-4 text-red-400" />}
                <span className="text-sm text-ink-200 font-light">{toast.message}</span>
              </div>
            ))}
          </div>
        </ToastContext.Provider>
      );
    };
    
    const useToast = () => React.useContext(ToastContext);

    // ============ CONSTANTS ============
    
    const SPIRIT_CATEGORIES = ['Gin', 'Vodka', 'Whiskey', 'Rum', 'Tequila', 'Brandy', 'Other'];

    const uniqStrings = (values) => {
      const seen = new Set();
      return (Array.isArray(values) ? values : [])
        .map(value => typeof value === 'string' ? value.trim() : '')
        .filter(Boolean)
        .filter(value => {
          const key = value.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    };
    
    const splitTagInput = (value) => uniqStrings((value || '').split(','));
    const buildFilterState = (payload = {}) => ({

    const mergeFilterState = (current = EMPTY_FILTERS, payload = {}) => ({

    const drinkMatchesFilterPayload = (drink, payload = {}) => {

      }
      if (payload.glasses?.length && !payload.glasses.includes(drink.glass)) return false;
      if (payload.tags?.length) {
        const drinkTags = getRecipeTaxonomyTags(drink);
        if (!payload.tags.some(tag => drinkTags.includes(tag))) return false;

    };
    const EXPERIENCE_PATHS = [
      {
        id: 'spirit-forward',

    ];
    const ingredientNamesForRecipe = (drink) => (drink.ingredients || []).map(ing => String(ing?.name || '').toLowerCase()).filter(Boolean);
    const getRecipeTaxonomyTags = (drink) => uniqStrings([
      ...(drink.experience_tags || []),

    ]);
    
    const normalizeLegacyTagGroup = (legacyTags = [], group) => {
      return uniqStrings(
        legacyTags
          .map(tag => LEGACY_TAG_MAP[String(tag || '').toLowerCase()])
          .filter(Boolean)
          .filter(entry => entry.group === group)
          .map(entry => entry.value)
      );
    };
    
    const recipeHasCitrus = (drink) => ingredientNamesForRecipe(drink).some(name =>
      name.includes('lemon juice') ||
      name.includes('lime juice') ||
      name.includes('grapefruit juice') ||
      name.includes('orange juice') ||
      name.includes('verjus') ||
      name.includes('citrus')
    );
    
    const recipeHasLengthener = (drink) => ingredientNamesForRecipe(drink).some(name =>
      name.includes('soda') ||
      name.includes('tonic') ||
      name.includes('ginger beer') ||
      name.includes('cola') ||
      name.includes('sparkling') ||
      name.includes('prosecco') ||
      name.includes('champagne')
    );
    
    const recipeHasVermouthLike = (drink) => ingredientNamesForRecipe(drink).some(name =>
      name.includes('vermouth') ||
      name.includes('lillet') ||
      name.includes('quinquina') ||
      name.includes('cocchi') ||
      name.includes('sherry')
    );
    
    const recipeHasStructuralBitterLike = (drink) => ingredientNamesForRecipe(drink).some(name =>
      name.includes('campari') ||
      name.includes('aperol') ||
      name.includes('amaro') ||
      name.includes('cynar') ||
      name.includes('suze') ||
      name.includes('fernet')
    );
    
    const inferTextureAgents = (drink) => uniqStrings(
      ingredientNamesForRecipe(drink).flatMap(name => {
        if (name.includes('egg white')) return ['Egg white'];
        if (name.includes('whole egg') || name === 'egg') return ['Egg'];
        if (name.includes('cream')) return ['Cream'];
        if (name.includes('milk')) return ['Milk'];
        if (name.includes('aquafaba')) return ['Aquafaba'];
        return [];
      })
    );
    
    const inferPrimaryFamilyFromRecipe = (drink) => {
      if (PRIMARY_FAMILY_OPTIONS.includes(drink?.primary_family)) return drink.primary_family;
      if (LEGACY_CATEGORY_TO_FAMILY[drink?.category]) return LEGACY_CATEGORY_TO_FAMILY[drink.category];
      if (LEGACY_TEMPLATE_TO_FAMILY[drink?.template]) return LEGACY_TEMPLATE_TO_FAMILY[drink.template];
      const legacyTags = (drink?.tags || []).map(tag => String(tag).toLowerCase());
      if (drink?.category === 'Tiki' || legacyTags.includes('tropical')) return 'Tropical / Punch-derived';
      if (inferTextureAgents(drink).length > 0) return 'Rich & Creamy';
      if (recipeHasCitrus(drink)) {
        if (recipeHasLengthener(drink)) return 'Collins';
        if (recipeHasStructuralBitterLike(drink)) return 'Enhanced Sour';
        return 'Sour';
      }
      if (recipeHasStructuralBitterLike(drink) && recipeHasVermouthLike(drink)) return 'Bitter Aromatized';
      if (recipeHasVermouthLike(drink)) return 'Aromatized';
      if (recipeHasLengthener(drink)) return 'Highball';

    const inferPrimaryTemplateFromRecipe = (drink) => {
      if (drink?.primary_template) return drink.primary_template;

    };
    
    const inferServiceStyleFromRecipe = (drink) => {

    const inferBaseSpiritFromRecipe = (drink) => {
      if (drink?.base_spirit) return drink.base_spirit;

      if (names.includes('irish whiskey') || names.includes('irish whisky')) return 'Whiskey — Irish';
      if (names.includes('whiskey') || names.includes('whisky')) return 'Whiskey — Bourbon';
      if (names.includes('overproof rum')) return 'Rum — Overproof';
      if (names.includes('aged rum') || names.includes('dark rum') || names.includes('gold rum')) return 'Rum — Aged';
      if (names.includes('rum')) return 'Rum — White';
      if (names.includes('gin')) return 'Gin';
      if (names.includes('vodka')) return 'Vodka';
      if (names.includes('pisco')) return 'Pisco';
      if (names.includes('calvados')) return 'Calvados';
      if (names.includes('aquavit')) return 'Aquavit';
      if (names.includes('eau de vie')) return 'Eau de vie';
      if (names.includes('brandy') || names.includes('cognac')) return 'Brandy / Cognac';
      return 'Other';
    };
    
    const inferBuildMethodFromRecipe = (drink) => {
      if (drink?.build_method) return drink.build_method;
      const method = detectMethod(drink);
      if (method === 'Shake') return 'Shaken';
      if (method === 'Stir') return 'Stirred';
      if (method === 'Build' || method === 'Muddle') return 'Built';
      if (method === 'Blend') return 'Blended';
      return '';
    };
    
    const inferExperienceTags = (drink, primaryFamily, citrusPresent, lengthened) => {
      return uniqStrings([
        ...(drink?.experience_tags || []),
        ...normalizeLegacyTagGroup(drink?.tags || [], 'experience'),
        ...(String(drink?.style || '').toLowerCase().includes('spirit-forward') ? ['Spirit-forward'] : []),
        ...(primaryFamily === 'Tropical / Punch-derived' ? ['Fruity', 'Complex'] : []),
        ...(primaryFamily === 'Bitter Aromatized' ? ['Bitter'] : []),
        ...(primaryFamily === 'Old-Fashioned' || primaryFamily === 'Aromatized' ? ['Spirit-forward'] : []),
        ...(citrusPresent && lengthened ? ['Refreshing'] : [])
      ]);

    const inferOccasionTags = (drink) => uniqStrings([
      ...(drink?.occasion_tags || []),

    const inferStructuralTags = (drink, citrusPresent, lengthened) => uniqStrings([

      ...((drink?.ingredients || []).length === 3 ? ['Three-ingredient'] : [])

    const normalizeRecipe = (recipe, defaultSource = null) => {
      if (!recipe || typeof recipe !== 'object') return null;
      const {
        category,
        style,
        ibaCategory,
        template,
        tags,
        _migration,
        ...rest
      } = recipe;
      
      const normalizedIngredients = Array.isArray(recipe.ingredients)
        ? recipe.ingredients
            .filter(Boolean)
            .map(ing => ({
              ...ing,
              name: String(ing.name || '').trim(),
              measure: String(ing.measure || ing.amount || '').trim()
            }))
            .filter(ing => ing.name)
        : [];
      
      const draft = {
        ...rest,
        category,
        style,
        ibaCategory,
        template,
        tags,
        ingredients: normalizedIngredients
      };
      const primary_family = inferPrimaryFamilyFromRecipe(draft);
      const citrus_present = typeof recipe.citrus_present === 'boolean' ? recipe.citrus_present : recipeHasCitrus(draft);
      const lengthened = typeof recipe.lengthened === 'boolean' ? recipe.lengthened : recipeHasLengthener(draft);
      
      return {
        ...rest,
        name: String(recipe.name || '').trim(),
        glass: String(recipe.glass || '').trim(),
        ingredients: normalizedIngredients,
        instructions: String(recipe.instructions || '').trim(),
        notes: String(recipe.notes || '').trim(),
        recipeSource: String(recipe.recipeSource || '').trim(),
        source: recipe.source || defaultSource || 'custom',
        primary_family,
        primary_template: inferPrimaryTemplateFromRecipe(recipe),
        secondary_template: String(recipe.secondary_template || '').trim(),
        build_method: inferBuildMethodFromRecipe(draft),
        service_style: inferServiceStyleFromRecipe(draft),
        base_spirit: inferBaseSpiritFromRecipe(draft),
        citrus_present,
        lengthened,
        texture_agents: uniqStrings(Array.isArray(recipe.texture_agents) ? recipe.texture_agents : inferTextureAgents(draft)),
        experience_tags: inferExperienceTags(recipe, primary_family, citrus_present, lengthened),
        occasion_tags: inferOccasionTags(recipe),
        structural_tags: inferStructuralTags(recipe, citrus_present, lengthened),
        classification_note: String(recipe.classification_note || '').trim(),
        originTitle: recipe.originTitle,
        originAuthor: recipe.originAuthor,
        originSourceType: recipe.originSourceType,
        originUrl: recipe.originUrl,
        originYear: recipe.originYear,
        originNotes: recipe.originNotes,
        dateAdded: recipe.dateAdded,
        image: recipe.image
      };
    };
    
    const normalizeRecipes = (recipes, defaultSource = null) =>
      (Array.isArray(recipes) ? recipes : [])
        .map(recipe => normalizeRecipe(recipe, defaultSource))
        .filter(Boolean);
    
    // Detect method from instructions
    const detectMethod = (drink) => {
      if (drink?.build_method) {
        const buildMethod = drink.build_method.toLowerCase();
        if (buildMethod.includes('shak')) return 'Shake';
        if (buildMethod.includes('stirr')) return 'Stir';
        if (buildMethod.includes('blend')) return 'Blend';
        if (buildMethod.includes('build') || buildMethod.includes('swizzle') || buildMethod.includes('throw') || buildMethod.includes('whip')) return 'Build';
      }
      const instr = (drink.instructions || '').toLowerCase();
      if (instr.includes('shake')) return 'Shake';
      if (instr.includes('stir')) return 'Stir';
      if (instr.includes('muddle')) return 'Muddle';
      if (instr.includes('blend')) return 'Blend';
      if (instr.includes('build') || instr.includes('pour') || instr.includes('top')) return 'Build';
      return null;
    };
    
    // Detect base spirit from ingredients
    const detectSpirit = (drink) => {
      if (drink?.base_spirit) {
        const base = drink.base_spirit.toLowerCase();
        if (base.includes('gin')) return 'Gin';
        if (base.includes('vodka')) return 'Vodka';
        if (base.includes('whiskey') || base.includes('whisky')) return 'Whiskey';
        if (base.includes('rum')) return 'Rum';
        if (base.includes('tequila') || base.includes('mezcal')) return 'Tequila';
        if (base.includes('brandy') || base.includes('cognac') || base.includes('pisco') || base.includes('calvados')) return 'Brandy';
        return 'Other';
      }
      const ings = drink.ingredients?.map(i => i.name.toLowerCase()).join(' ') || '';
      if (ings.includes('gin')) return 'Gin';
      if (ings.includes('vodka')) return 'Vodka';
      if (ings.match(/whiskey|whisky|bourbon|rye|scotch/)) return 'Whiskey';
      if (ings.includes('rum')) return 'Rum';
      if (ings.match(/tequila|mezcal/)) return 'Tequila';
      if (ings.match(/brandy|cognac/)) return 'Brandy';
      return 'Other';
    };
    
    // Extract 3-5 key modifiers from ingredients (vermouth, amaro, bitters, liqueurs)
    const extractModifiers = (drink, ingredientsDb) => {
      if (!drink.ingredients?.length || !ingredientsDb) return [];
      
      const modifiers = [];
      const modifierKeywords = [
        'vermouth', 'amaro', 'bitters', 'liqueur', 'chartreuse', 'campari', 'aperol',
        'cynar', 'fernet', 'benedictine', 'maraschino', 'cointreau', 'triple sec',
        'st germain', 'elderflower', 'domaine', 'allspice', 'peychaud', 'angostura',
        'orange bitters', 'chocolate bitters', 'aromatic bitters'
      ];
      
      // Get base spirits to exclude
      const spiritKeywords = ['gin', 'vodka', 'whiskey', 'whisky', 'bourbon', 'rye', 'scotch', 'rum', 'tequila', 'mezcal', 'brandy', 'cognac'];
      const citrusKeywords = ['lemon juice', 'lime juice', 'orange juice', 'grapefruit juice', 'citrus'];
      
      for (const ing of drink.ingredients) {
        if (!ing || !ing.name || typeof ing.name !== 'string') continue;
        const ingLower = ing.name.toLowerCase();
        const ingCanonical = normalizeIngredient(ing.name, ingredientsDb);
        
        // Skip base spirits and citrus
        const isSpirit = spiritKeywords.some(s => ingLower.includes(s));
        const isCitrus = citrusKeywords.some(c => ingLower.includes(c));
        if (isSpirit || isCitrus) continue;
        
        // Check if it's a modifier
        const isModifier = modifierKeywords.some(keyword => ingLower.includes(keyword));
        if (isModifier) {
          // Get display name from ingredients DB if available, otherwise use original
          let displayName = ing.name;
          if (ingredientsDb) {
            for (const category of ingredientsDb.categories || []) {
              for (const subcategory of category.subcategories || []) {
                for (const item of subcategory.items || []) {
                  const itemCanonical = normalizeIngredient(item.name, ingredientsDb);
                  if (itemCanonical === ingCanonical || 
                      item.aliases?.some(alias => normalizeIngredient(alias, ingredientsDb) === ingCanonical)) {
                    displayName = item.name;
                    break;
                  }
                }
              }
            }
          }
          
          // Avoid duplicates
          if (!modifiers.find(m => normalizeIngredient(m, ingredientsDb) === ingCanonical)) {
            modifiers.push(displayName);
          }
        }
      }
      
      // Prioritize: Vermouth > Amaro > Bitters > Other liqueurs
      const priority = (name) => {
        const n = name.toLowerCase();
        if (n.includes('vermouth')) return 1;
        if (n.includes('amaro') || n.includes('cynar') || n.includes('fernet') || n.includes('campari') || n.includes('aperol')) return 2;
        if (n.includes('bitters')) return 3;
        return 4;
      };
      
      modifiers.sort((a, b) => priority(a) - priority(b));
      
      // Return 3-5 items max
      return modifiers.slice(0, 5);
    };

    // Unit conversion utilities with intelligent rounding
    const parseMeasure = (measure) => {
      if (!measure) return { value: 0, unit: '', isFraction: false };
      
      const measureStr = measure.toString().trim();
      
      // Handle common non-numeric measures (dash, dashes, splash, rinse, etc.)
      const nonNumericUnits = ['dash', 'dashes', 'splash', 'rinse', 'drops', 'pinch', 'whole', 'leaves', 'barspoon', 'barspoons'];
      for (const unit of nonNumericUnits) {
        if (measureStr.toLowerCase().includes(unit)) {
          return { value: null, unit: measureStr, isFraction: false };
        }
      }
      
      // Extract number and unit
      const match = measureStr.match(/^([\d\s\/\.]+)\s*(ml|oz|oz\.|fl\s*oz)?$/i);
      if (!match) return { value: 0, unit: measureStr, isFraction: false };
      
      const numPart = match[1].trim();
      const unitPart = (match[2] || '').trim().toLowerCase();
      
      // Parse fractions and decimals
      let value = 0;
      let isFraction = false;
      
      if (numPart.includes('/')) {
        // Handle fractions like "1/2", "1 1/2", "3/4"
        const parts = numPart.split(/\s+/);
        for (const part of parts) {
          if (part.includes('/')) {
            const [num, den] = part.split('/').map(Number);
            value += num / den;
            isFraction = true;
          } else {
            value += Number(part) || 0;
          }
        }
      } else {
        value = Number(numPart) || 0;
      }
      
      // Determine base unit
      const baseUnit = unitPart.includes('ml') ? 'ml' : 'oz';
      
      return { value, unit: baseUnit, isFraction, originalUnit: unitPart };
    };

    const convertMeasure = (measure, targetUnit) => {
      const parsed = parseMeasure(measure);

      // If it's a non-numeric measure, return as-is
      if (parsed.value === null) return measure;

      // If already in target unit or no value, return original
      if (!parsed.value || (targetUnit === 'oz' && parsed.unit === 'oz') || (targetUnit === 'ml' && parsed.unit === 'ml')) {
        return measure;
      }

      // Convert using precise conversion: 1 oz = 29.5735 ml
      const OZ_TO_ML = 29.5735;
      const ML_TO_OZ = 1 / OZ_TO_ML;

      // Convert oz to ml
      if (parsed.unit === 'oz' && targetUnit === 'ml') {
        const mlValue = parsed.value * OZ_TO_ML;
        // Round to nearest 2.5ml or 5ml for readability, never show decimals like 29.57
        if (mlValue < 2.5) {
          return `${Math.round(mlValue * 2) / 2} ml`; // Round to nearest 0.5ml for small amounts
        }
        // Round to nearest 2.5ml for better readability
        const rounded = Math.round(mlValue / 2.5) * 2.5;
        // Format as integer if whole number, otherwise show one decimal
        return `${rounded % 1 === 0 ? rounded : rounded.toFixed(1)} ml`;
      }

      // Convert ml to oz
      if (parsed.unit === 'ml' && targetUnit === 'oz') {
        const ozValue = parsed.value * ML_TO_OZ;
        // Round to common cocktail decimals: 0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, etc.
        const commonValues = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3];
        let closest = commonValues[0];
        let minDiff = Math.abs(ozValue - closest);

        for (const val of commonValues) {
          const diff = Math.abs(ozValue - val);
          if (diff < minDiff) {
            minDiff = diff;
            closest = val;
          }
        }

        // If very close to a common value (< 0.05 oz difference), use it
        if (minDiff < 0.05) {
          // Format as fractions for readability
          if (closest === 0.25) return '1/4 oz';
          if (closest === 0.5) return '1/2 oz';
          if (closest === 0.75) return '3/4 oz';
          if (closest === 1.25) return '1 1/4 oz';
          if (closest === 1.5) return '1 1/2 oz';
          if (closest === 1.75) return '1 3/4 oz';
          if (closest === 2.25) return '2 1/4 oz';
          if (closest === 2.5) return '2 1/2 oz';
          if (closest === 2.75) return '2 3/4 oz';
          return `${closest} oz`;
        }

        // Otherwise round to one decimal max
        const rounded = Math.round(ozValue * 4) / 4; // Round to nearest 0.25
        return `${rounded} oz`;
      }

      return measure;
    };
