            const loaded = JSON.parse(coll.value);
            setCollections(loaded.filter(c => !c.collectionType || c.collectionType === 'personal'));
          }
          if (made?.value) setMadeCounts(JSON.parse(made.value));
          const recipeNotes = storage.get('user-recipe-notes');
          if (recipeNotes?.value) {
            try {
              setUserRecipeNotes(JSON.parse(recipeNotes.value));
            } catch {
              setUserRecipeNotes({});
            }
          }
        } catch (err) {
          console.error('Load error:', err);
        }
      };
      
      // Save filters and sort per view
      useEffect(() => {
        if (view && (view === 'browse' || view === 'keepers' || view === 'toTry' || view === 'canMake' || view === 'almostMake' || view === 'custom')) {
          storage.set(`filters-${view}`, JSON.stringify(filters));
          storage.set(`sort-${view}`, sortBy);
        }
      }, [filters, sortBy, view]);

      // Save unit preference
      useEffect(() => {
        storage.set('unit-preference', unitPreference);
      }, [unitPreference]);

      // Save theme preference and apply to document
      useEffect(() => {
        storage.set('theme-preference', theme);
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      // Lock body scroll when modals are open
      useEffect(() => {
        if (selectedDrink || showAddDrink || showImportExport || showConfirmDelete || showImportShared || showOnboarding) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => {
          document.body.style.overflow = '';
        };
      }, [selectedDrink, showAddDrink, showImportExport, showConfirmDelete, showImportShared, showOnboarding]);

      const saveData = (key, data) => storage.set(key, JSON.stringify(data));
      
      // Save user recipe notes
      const saveUserRecipeNotes = (notes) => {
        setUserRecipeNotes(notes);
        saveData('user-recipe-notes', notes);
      };
      
      // Update note for a specific recipe
      const updateUserRecipeNote = (recipeId, note) => {
        const updated = { ...userRecipeNotes };
        if (note && note.trim()) {
          updated[recipeId] = note.trim();
        } else {
          delete updated[recipeId];
        }
        saveUserRecipeNotes(updated);
      };

      // Migration: Convert old single inventory to bars system
      const migrateToBars = () => {
        const oldInv = storage.get('bar-inventory');
        const barsData = storage.get('bars');
        const activeBar = storage.get('active-bar-id');
        
        // If bars already exist, we're already migrated
        if (barsData?.value) {
          const loadedBars = JSON.parse(barsData.value);
          setBars(loadedBars);
          const savedActiveId = activeBar?.value;
          // Find main bar or first bar
          const mainBar = loadedBars.find(b => b.isMain) || loadedBars[0];
          setActiveBarId(savedActiveId && loadedBars.find(b => b.id === savedActiveId) ? savedActiveId : (mainBar?.id || null));
          return;
        }
        
        // Migration: Convert old inventory to "Home" bar
        if (oldInv?.value) {
          const oldInventory = JSON.parse(oldInv.value);
          const homeBar = {
            id: `bar-${Date.now()}`,
            name: 'Home',
            isMain: true,
            inventory: oldInventory,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          setBars([homeBar]);
          setActiveBarId(homeBar.id);
          saveData('bars', [homeBar]);
          saveData('active-bar-id', homeBar.id);
        } else {
          // No existing inventory - create default Home bar
          const homeBar = {
            id: `bar-${Date.now()}`,
            name: 'Home',
            isMain: true,
            inventory: [],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          setBars([homeBar]);
          setActiveBarId(homeBar.id);
          saveData('bars', [homeBar]);
          saveData('active-bar-id', homeBar.id);
        }
      };

      // Automatic daily backup
      const performAutomaticBackup = () => {
        try {
          const backup = {
            schema: 'barkeep-v1',
            version: '1.0.0',
            exportDate: new Date().toISOString(),
            data: {
              customDrinks,
              bars,
              activeBarId,
            keepers: Array.from(keepers),
              collections,
              madeCounts
            }
          };
          
          const backups = JSON.parse(storage.get('auto-backups')?.value || '[]');
          backups.push(backup);
          
          // Keep only last 7 backups
          const trimmed = backups.slice(-7);
          
          storage.set('auto-backups', JSON.stringify(trimmed));
          storage.set('last-backup-date', new Date().toISOString().split('T')[0]);
        } catch (err) {
          console.error('Auto backup failed:', err);
        }
      };
      
      // Check if backup is needed (daily) - run after data loads
      useEffect(() => {
        if (loading) return; // Wait for data to load
        
        const today = new Date().toISOString().split('T')[0];
        const lastBackup = storage.get('last-backup-date')?.value;
        
        if (lastBackup !== today) {
          // Perform backup after a short delay to ensure all data is loaded
          const timer = setTimeout(() => {
            performAutomaticBackup();
          }, 3000);
          return () => clearTimeout(timer);
        }
      }, [loading]); // Run when data finishes loading
      
      // Export everything
      const exportEverything = () => {
        const data = {
          schema: 'barkeep-v1',
          version: '1.1.0',
          exportDate: new Date().toISOString(),
          data: {
            customDrinks,
            bars,
            activeBarId,
            keepers: Array.from(keepers),
            collections,
            madeCounts,
            userRecipeNotes
          }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `barkeep-full-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Full backup downloaded', 'success');
      };

      const importEverything = (event, mergeMode = false) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            
            // Handle both old format and new format
            const data = imported.data || imported;
            
            if (mergeMode) {
              // Merge mode: combine with existing data
              if (data.customDrinks) {
                const incomingCustom = normalizeRecipes(data.customDrinks, 'custom');
                const merged = [...customDrinks, ...incomingCustom.filter(d => !customDrinks.some(existing => existing.id === d.id))];
                setCustomDrinks(merged);
                saveData('custom-drinks', merged);
              }
              // Handle bars (new format) or barInventory (old format)
              if (data.bars) {
                // Merge bars - avoid duplicates by id
                const existingIds = new Set(bars.map(b => b.id));
                const merged = [...bars, ...data.bars.filter(b => !existingIds.has(b.id))];
                saveBars(merged);
                if (data.activeBarId && merged.find(b => b.id === data.activeBarId)) {
                  saveActiveBarId(data.activeBarId);
                }
              } else if (data.barInventory) {
                // Old format: merge into active bar or create new bar
                const activeBar = getActiveBar();
                if (activeBar) {
                  const existingIds = new Set(activeBar.inventory.map(i => i.id));
                  const merged = [...activeBar.inventory, ...data.barInventory.filter(i => !existingIds.has(i.id))];
                  updateActiveBarInventory(merged);
                }
              }
              // Handle keepers (new format) or migrate from old format
              if (data.keepers) {
                const merged = new Set([...keepers, ...data.keepers]);
                setKeepers(merged);
                saveData('keepers', Array.from(merged));
              } else {
                // Migrate old favorites to keepers
                if (data.favorites) {
                  const merged = new Set([...keepers, ...data.favorites]);
                  setKeepers(merged);
                  saveData('keepers', Array.from(merged));
                }
              }
              
              // Handle to_try collection migration from old saved/wantToTry
              if (data.collections) {
                const merged = [...collections, ...data.collections.filter(c => !collections.some(existing => existing.id === c.id))];
                
                // Migrate old saved/wantToTry to to_try collection
                const toTryIds = new Set();
                if (data.savedDrinks) toTryIds.add(...data.savedDrinks);
                if (data.wantToTry) toTryIds.add(...data.wantToTry);
                
                if (toTryIds.size > 0) {
                  let toTryColl = merged.find(c => c.id === 'to_try');
                  if (!toTryColl) {
                    toTryColl = {
                      id: 'to_try',
                      name: 'Try',
                      description: 'Recipes you want to try',
                      collectionType: 'personal',
                      recipeIds: []
                    };
                    merged.push(toTryColl);
                  }
                  const existingIds = new Set(toTryColl.recipeIds || []);
                  toTryIds.forEach(id => existingIds.add(id));
                  const updated = merged.map(c => 
                    c.id === 'to_try' ? { ...c, recipeIds: Array.from(existingIds) } : c
                  );
                  setCollections(updated);
                  saveData('collections', updated);
                } else {
                  setCollections(merged);
                  saveData('collections', merged);
                }
              }
              if (data.collections) {
                const merged = [...collections, ...data.collections.filter(c => !collections.some(existing => existing.id === c.id))];
                setCollections(merged);
                saveData('collections', merged);
              }
              if (data.madeCounts) {
                const merged = { ...madeCounts, ...data.madeCounts };
                setMadeCounts(merged);
                saveData('made-counts', merged);
              }
              if (data.userRecipeNotes) {
                const merged = { ...userRecipeNotes, ...data.userRecipeNotes };
                setUserRecipeNotes(merged);
                saveData('user-recipe-notes', merged);
              }
              toast('Data merged successfully', 'success');
            } else {
              // Replace mode: overwrite existing data
              if (data.customDrinks) {
                const normalizedCustom = normalizeRecipes(data.customDrinks, 'custom');
                setCustomDrinks(normalizedCustom);
                saveData('custom-drinks', normalizedCustom);
              }
              if (data.bars) {
                saveBars(data.bars);
                if (data.activeBarId && data.bars.find(b => b.id === data.activeBarId)) {
                  saveActiveBarId(data.activeBarId);
                } else {
                  const mainBar = data.bars.find(b => b.isMain) || data.bars[0];
                  if (mainBar) saveActiveBarId(mainBar.id);
                }
              } else if (data.barInventory) {
                // Old format: replace active bar inventory or create default bar
                const homeBar = {
                  id: `bar-${Date.now()}`,
                  name: 'Home',
                  isMain: true,
                  inventory: data.barInventory,
                  createdAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString()
                };
                saveBars([homeBar]);
                saveActiveBarId(homeBar.id);
              }
              // Handle keepers (new format) or migrate from old format
              if (data.keepers) {
                setKeepers(new Set(data.keepers));
                saveData('keepers', data.keepers);
              } else if (data.favorites) {
                // Migrate old favorites to keepers
                setKeepers(new Set(data.favorites));
                saveData('keepers', data.favorites);
              }
              
              // Handle collections and migrate old saved/wantToTry to to_try
              if (data.collections) {
                let updatedCollections = data.collections;
                
                // Migrate old saved/wantToTry to to_try collection
                const toTryIds = new Set();
                if (data.savedDrinks) data.savedDrinks.forEach(id => toTryIds.add(id));
                if (data.wantToTry) data.wantToTry.forEach(id => toTryIds.add(id));
                
                if (toTryIds.size > 0) {
                  let toTryColl = updatedCollections.find(c => c.id === 'to_try');
                  if (!toTryColl) {
                    toTryColl = {
                      id: 'to_try',
                      name: 'Try',
                      description: 'Recipes you want to try',
                      collectionType: 'personal',
                      recipeIds: Array.from(toTryIds)
                    };
                    updatedCollections.push(toTryColl);
                  } else {
                    const existingIds = new Set(toTryColl.recipeIds || []);
                    toTryIds.forEach(id => existingIds.add(id));
                    updatedCollections = updatedCollections.map(c => 
                      c.id === 'to_try' ? { ...c, recipeIds: Array.from(existingIds) } : c
                    );
                  }
                }
                
                setCollections(updatedCollections);
                saveData('collections', updatedCollections);
              }
              if (data.madeCounts) { setMadeCounts(data.madeCounts); saveData('made-counts', data.madeCounts); }
              if (data.userRecipeNotes) { setUserRecipeNotes(data.userRecipeNotes); saveData('user-recipe-notes', data.userRecipeNotes); }
              toast('Data replaced successfully', 'success');
            }
            
            // Reload to refresh UI
            loadUserData();
          } catch (err) {
            console.error('Import error:', err);
            toast('Failed to import data', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Helpers
      const getAllDrinks = () => [...curatedDrinks.map(d => ({...d, source: 'curated'})), ...customDrinks.map(d => ({...d, source: 'custom'}))];

      // Bars management helpers
      const getActiveBar = () => bars.find(b => b.id === activeBarId) || bars.find(b => b.isMain) || bars[0] || null;
      const getActiveBarInventory = () => {
        const activeBar = getActiveBar();
        return activeBar?.inventory || [];
      };

      // Save bars to storage
      const saveBars = (updatedBars) => {
        setBars(updatedBars);
        saveData('bars', updatedBars);
      };

      // Save active bar id
      const saveActiveBarId = (id) => {
        setActiveBarId(id);
        saveData('active-bar-id', id);
      };

      // Update active bar inventory
      const updateActiveBarInventory = (inventory) => {
        const updatedBars = bars.map(b => {
          if (b.id === activeBarId) {
            return { ...b, inventory, updatedAt: new Date().toISOString() };
          }
          return b;
        });
        saveBars(updatedBars);
      };

      // Get substitution information for a drink
      // Returns: { canMake: boolean, substitutions: Map<ingredientName, substituteName> }
      const getDrinkSubstitutions = (drink) => {
        if (!drink.ingredients?.length) return { canMake: false, substitutions: new Map() };
        const barInventory = getActiveBarInventory();
        const invCanonical = new Set(barInventory.map(i => normalizeIngredient(i.name, ingredientsDb)));
        const substitutions = new Map();
        
        const canMake = drink.ingredients.every(ing => {
          const ingCanonical = normalizeIngredient(ing.name, ingredientsDb);
          
          // Exact match - no substitution needed
          if (invCanonical.has(ingCanonical)) {
            return true;
          }
          
          // Try to find a substitute
          const substitute = findSubstitute(ingCanonical, barInventory, ingredientsDb);
          if (substitute) {
            substitutions.set(ing.name, substitute.substitute);
            return true;
          }
          
          return false;
        });
        
        return { canMake, substitutions };
      };

      const canMakeDrink = (drink) => {
        return getDrinkSubstitutions(drink).canMake;
      };

      const getMissingCount = (drink) => {
        if (!drink.ingredients?.length) return 0;
        const barInventory = getActiveBarInventory();
        const invCanonical = new Set(barInventory.map(i => normalizeIngredient(i.name, ingredientsDb)));
        return drink.ingredients.filter(ing => {
          const ingCanonical = normalizeIngredient(ing.name, ingredientsDb);
          
          // Exact match
          if (invCanonical.has(ingCanonical)) {
            return false;
          }
          
          // Check if substitution is available
          const substitute = findSubstitute(ingCanonical, barInventory, ingredientsDb);
          return !substitute;
        }).length;
      };

      const getMakeableDrinks = () => getAllDrinks().filter(canMakeDrink);

      // Actions with toast feedback
      const toggleKeeper = (id) => {
        const newSet = new Set(keepers);
        const wasAdded = !newSet.has(id);
        wasAdded ? newSet.add(id) : newSet.delete(id);
        setKeepers(newSet);
        saveData('keepers', Array.from(newSet));
        toast(wasAdded ? 'Added to Keepers' : 'Removed from Keepers', 'success');
      };

      // Get or create to_try collection
      const getToTryCollection = () => {
        let toTry = collections.find(c => c.id === 'to_try');
        if (!toTry) {
          toTry = {
            id: 'to_try',
            name: 'Try',
            description: 'Recipes you want to try',
            collectionType: 'personal',
            recipeIds: []
          };
          const updated = [...collections, toTry];
          setCollections(updated);
          saveData('collections', updated);
        }
        return toTry;
      };

      // Toggle recipe in to_try collection
      const toggleToTry = (recipeId) => {
        if (!collections || !Array.isArray(collections)) return;
        let toTry = collections.find(c => c.id === 'to_try');
        let currentCollections = [...collections];
        
        // Create to_try collection if it doesn't exist
        if (!toTry) {
          toTry = {
            id: 'to_try',
            name: 'Try',
            description: 'Recipes you want to try',
            collectionType: 'personal',
            recipeIds: []
          };
          currentCollections.push(toTry);
        }
        
        const recipeIds = new Set(toTry.recipeIds || []);
        const wasAdded = !recipeIds.has(recipeId);
        
        if (wasAdded) {
          recipeIds.add(recipeId);
        } else {
          recipeIds.delete(recipeId);
        }
        
        const updatedCollections = currentCollections.map(c => 
          c.id === 'to_try'
            ? { ...c, recipeIds: Array.from(recipeIds) }
            : c
        );
        
        setCollections(updatedCollections);
        saveData('collections', updatedCollections);
        toast(wasAdded ? 'Added to Try' : 'Removed from Try', 'success');
      };

      // Check if recipe is in to_try collection
      const isInToTry = (recipeId) => {
        if (!collections || !Array.isArray(collections)) return false;
        const toTry = collections.find(c => c.id === 'to_try');
        return toTry?.recipeIds?.includes(recipeId) || false;
      };

      // Toggle ingredient in ingredients_to_try collection
      const toggleIngredientToTry = (ingredientCanonical) => {
        if (!collections || !Array.isArray(collections)) return;
        let ingredientsToTry = collections.find(c => c.id === 'ingredients_to_try');
        let currentCollections = [...collections];
        
        // Create ingredients_to_try collection if it doesn't exist
        if (!ingredientsToTry) {
          ingredientsToTry = {
            id: 'ingredients_to_try',
            name: 'Want to Try',
            description: 'Ingredients you want to try',
            collectionType: 'personal',
            ingredientCanonicals: []
          };
          currentCollections.push(ingredientsToTry);
        }
        
        const ingredientCanonicals = new Set(ingredientsToTry.ingredientCanonicals || []);
        const wasAdded = !ingredientCanonicals.has(ingredientCanonical);
        
        if (wasAdded) {
          ingredientCanonicals.add(ingredientCanonical);
        } else {
          ingredientCanonicals.delete(ingredientCanonical);
        }
        
        const updatedCollections = currentCollections.map(c => 
          c.id === 'ingredients_to_try'
            ? { ...c, ingredientCanonicals: Array.from(ingredientCanonicals) }
            : c
        );
        
        setCollections(updatedCollections);
        saveData('collections', updatedCollections);
        toast(wasAdded ? 'Added to Want to Try' : 'Removed from Want to Try', 'success');
      };

      // Check if ingredient is in ingredients_to_try collection
      const isIngredientInToTry = (ingredientCanonical) => {
        if (!collections || !Array.isArray(collections)) return false;
        const ingredientsToTry = collections.find(c => c.id === 'ingredients_to_try');
        return ingredientsToTry?.ingredientCanonicals?.includes(ingredientCanonical) || false;
      };

      const addCustomDrink = (drink) => {
        const newDrink = normalizeRecipe({
          id: `custom-${Date.now()}`,
          ...drink,
          dateAdded: new Date().toISOString(),
          source: 'custom'
        }, 'custom');
        const updated = [...customDrinks, newDrink];
        setCustomDrinks(updated);
        saveData('custom-drinks', updated);
        setShowAddDrink(false);
        setEditingDrink(null);
        toast('Recipe saved', 'success');
      };

      const updateCustomDrink = (id, drink) => {
        const updated = customDrinks.map(d => 
          d.id === id 
            ? normalizeRecipe({ ...d, ...drink, id, dateAdded: d.dateAdded || new Date().toISOString(), source: 'custom' }, 'custom')
            : d
        );
        setCustomDrinks(updated);
        saveData('custom-drinks', updated);
        setShowAddDrink(false);
        setEditingDrink(null);
        toast('Recipe updated', 'success');
      };

      const deleteCustomDrink = (id) => {
        const updated = customDrinks.filter(d => d.id !== id);
        setCustomDrinks(updated);
        saveData('custom-drinks', updated);
        // Remove from collections
        const updatedCollections = collections.map(coll => ({
          ...coll,
          recipeIds: coll.recipeIds.filter(rid => rid !== id)
        }));
        setCollections(updatedCollections);
        saveData('collections', updatedCollections);
        setSelectedDrink(null);
        setShowConfirmDelete(null);
        toast('Recipe deleted', 'success');
      };

      // Share recipe
      const shareRecipe = async (drink) => {
        // Convert ingredients to current unit preference
        const convertedIngredients = drink.ingredients?.map(i => ({
          ...i,
          measure: convertMeasure(i.measure, unitPreference)
        })) || [];
        
        const sharePayload = {
          schema: 'barkeep-recipe-v2',
          createdAt: new Date().toISOString(),
          recipe: {
            id: drink.id,
            name: drink.name,
            glass: drink.glass,
            ingredients: convertedIngredients,
            instructions: drink.instructions,
            notes: drink.notes,
            image: drink.image,
            source: drink.source,
            primary_family: drink.primary_family,
            primary_template: drink.primary_template,
            secondary_template: drink.secondary_template,
            build_method: drink.build_method,
            service_style: drink.service_style,
            base_spirit: drink.base_spirit,
            citrus_present: drink.citrus_present,
            lengthened: drink.lengthened,
            texture_agents: drink.texture_agents,
            experience_tags: drink.experience_tags,
            occasion_tags: drink.occasion_tags,
            structural_tags: drink.structural_tags,
            classification_note: drink.classification_note,
            // Origin fields (optional)
            originTitle: drink.originTitle,
            originAuthor: drink.originAuthor,
            originSourceType: drink.originSourceType,
            originUrl: drink.originUrl,
            originYear: drink.originYear,
            originNotes: drink.originNotes
          }
        };
        
        const shareText = `${drink.name}\n\nIngredients:\n${convertedIngredients.map(i => `• ${i.measure} ${i.name}`).join('\n')}\n\n${drink.instructions || ''}\n\n---\nShared from Barkeep`;
        
        // Try Web Share API first
        if (navigator.share) {
          try {
            await navigator.share({
              title: drink.name,
              text: shareText,
              url: window.location.href
            });
            toast('Recipe shared', 'success');
            return;
          } catch (err) {
            if (err.name !== 'AbortError') {
              // Fall through to clipboard
            }
          }
        }
        
        // Fallback to clipboard
        try {
          await navigator.clipboard.writeText(shareText);
          toast('Recipe copied to clipboard', 'success');
        } catch (err) {
          // Final fallback: show data for manual copy
          setSharedRecipeData(sharePayload);
          toast('Share data prepared', 'success');
        }
      };

      // Import shared recipe
      const importSharedRecipe = (sharedData, dedupeMode = 'new') => {
        try {
          const importedRecipe = sharedData?.recipe || sharedData;
          if (!importedRecipe) {
            toast('Invalid recipe data', 'error');
            return;
          }
          
          const recipe = normalizeRecipe({ ...importedRecipe, source: 'custom' }, 'custom');
          const existingIndex = customDrinks.findIndex(d => d.id === recipe.id);
          
          // Preserve origin fields if they exist
          const recipeWithOrigin = {
            ...recipe,
            originTitle: recipe.originTitle,
            originAuthor: recipe.originAuthor,
            originSourceType: recipe.originSourceType,
            originUrl: recipe.originUrl,
            originYear: recipe.originYear,
            originNotes: recipe.originNotes
          };
          
          if (existingIndex !== -1 && dedupeMode === 'replace') {
            // Replace existing
            const updated = [...customDrinks];
            updated[existingIndex] = { ...recipeWithOrigin, dateAdded: customDrinks[existingIndex].dateAdded || new Date().toISOString() };
            setCustomDrinks(updated);
            saveData('custom-drinks', updated);
            toast('Recipe replaced', 'success');
          } else {
            // Add as new (or if doesn't exist)
            const newId = existingIndex !== -1 ? `custom-${Date.now()}` : recipe.id;
            const newDrink = { ...recipeWithOrigin, id: newId, dateAdded: new Date().toISOString(), source: 'custom' };
            const updated = [...customDrinks, newDrink];
            setCustomDrinks(updated);
            saveData('custom-drinks', updated);
            toast('Recipe imported', 'success');
          }
          
          setShowImportShared(false);
          setSharedRecipeData(null);
        } catch (err) {
          toast('Failed to import recipe', 'error');
        }
      };

      // Curated collections (rule-based, system collections)
      const CURATED_COLLECTIONS = [
        {
          id: 'curated-classics',
          name: 'Classics',
          description: 'Time-tested cocktails that every bartender should know',
          collectionType: 'curated',
          rules: {
            templates: ['Old-Fashioned', 'Manhattan', 'Martini', 'Negroni', 'Daiquiri', 'Whiskey Sour', 'Margarita', 'Sidecar', 'Tom Collins', 'Mai Tai']
          }
        },
        {
          id: 'curated-no-citrus',
          name: 'No Citrus',
          description: 'Cocktails without lemon, lime, or other citrus',
          collectionType: 'curated',
          rules: {
            hasCitrus: false
          }
        },
        {
          id: 'curated-stirred',
          name: 'Stirred',
          description: 'Cocktails that are stirred, not shaken',
          collectionType: 'curated',
          rules: {
            method: ['Stir']
          }
        },
        {
          id: 'curated-shaken',
          name: 'Shaken',
          description: 'Cocktails that are shaken',
          collectionType: 'curated',
          rules: {
            method: ['Shake']
          }
        },
        {
          id: 'curated-gin',
          name: 'Gin Cocktails',
          description: 'All cocktails featuring gin',
          collectionType: 'curated',
          rules: {
            baseSpirit: ['Gin']
          }
        },
        {
          id: 'curated-whiskey',
          name: 'Whiskey Cocktails',
          description: 'All cocktails featuring whiskey',
          collectionType: 'curated',
          rules: {
            baseSpirit: ['Whiskey']
          }
        },
        {
          id: 'curated-tiki',
          name: 'Tiki',
          description: 'Tropical and tiki-style cocktails',
          collectionType: 'curated',
          rules: {
            families: ['Tropical / Punch-derived']
          }
        },
        {
          id: 'curated-spirit-forward',
          name: 'Spirit Forward',
          description: 'Cocktails where the spirit is the star',
          collectionType: 'curated',
          rules: {
            tags: ['Spirit-forward', 'Boozy']
          }
        },
        {
          id: 'curated-coupes',
          name: 'Coupes & Cocktail Glasses',
          description: 'Cocktails served in coupes or cocktail glasses',
          collectionType: 'curated',
          rules: {
            glass: ['Coupe', 'Cocktail glass']
          }
        }
      ];

      // Evaluate if a drink matches curated collection rules
      const matchesCuratedCollection = (drink, collection) => {
        if (!collection.rules) return false;
        const rules = collection.rules;
        
        // Base spirit rule
        if (rules.baseSpirit && rules.baseSpirit.length > 0) {
          const spirit = detectSpirit(drink);
          if (!rules.baseSpirit.includes(spirit)) return false;
        }
        
        if (rules.families && rules.families.length > 0) {
          if (!drink.primary_family || !rules.families.includes(drink.primary_family)) return false;
        }
        
        if (rules.templates && rules.templates.length > 0) {
          const templates = [drink.primary_template, drink.secondary_template].filter(Boolean);
          if (!templates.some(templateName => rules.templates.includes(templateName))) return false;
        }
        
        // Method rule
        if (rules.method && rules.method.length > 0) {
          const method = detectMethod(drink);
          if (!method || !rules.method.includes(method)) return false;
        }
        
        // Glass rule
        if (rules.glass && rules.glass.length > 0) {
          if (!drink.glass || !rules.glass.includes(drink.glass)) return false;
        }
        
        // Has citrus rule
        if (rules.hasCitrus !== undefined) {
          const hasCitrus = typeof drink.citrus_present === 'boolean' ? drink.citrus_present : recipeHasCitrus(drink);
          if (rules.hasCitrus !== hasCitrus) return false;
        }
        
        // Tags rule (checks any taxonomy tag group)
        if (rules.tags && rules.tags.length > 0) {
          const drinkTags = getRecipeTaxonomyTags(drink);
          if (!rules.tags.some(tag => drinkTags.includes(tag))) return false;
        }
        
        return true;
      };

      // Get all collections (curated + personal, including system collections)
      const getAllCollections = useMemo(() => {
        if (!collections || !Array.isArray(collections)) {
          return CURATED_COLLECTIONS || [];
        }
        const personal = collections.filter(c => !c.collectionType || c.collectionType === 'personal');
        return [...(CURATED_COLLECTIONS || []), ...personal];
      }, [collections]);

      // Get system collections (to_try is a personal collection, keepers is a view)
      const getSystemCollections = () => {
        const toTry = collections.find(c => c.id === 'to_try') || {
          id: 'to_try',
          name: 'To Try',
          description: 'Recipes you want to try',
          collectionType: 'personal',
          recipeIds: []
        };
        const ingredientsToTry = collections.find(c => c.id === 'ingredients_to_try') || {
          id: 'ingredients_to_try',
          name: 'Want to Try',
          description: 'Ingredients you want to try',
          collectionType: 'personal',
          ingredientCanonicals: []
        };
        return [toTry, ingredientsToTry];
      };

      // Get recipes for a collection (rule-based for curated, recipeIds for personal)
      const getCollectionRecipes = useMemo(() => {
        return (collection) => {
          if (collection.collectionType === 'curated') {
            // Evaluate rules live
            return getAllDrinks().filter(drink => matchesCuratedCollection(drink, collection));
          } else {
            // Personal collection - use recipeIds
            return getAllDrinks().filter(d => collection.recipeIds?.includes(d.id));
          }
        };
      }, [curatedDrinks, customDrinks]);

      // Collections CRUD
      const addCollection = (name, description = '') => {
        const newCollection = {
          id: `collection-${Date.now()}`,
          name,
          description,
          recipeIds: [],
          collectionType: 'personal',
          createdAt: new Date().toISOString()
        };
        const updated = [...collections, newCollection];
        setCollections(updated);
        saveData('collections', updated);
        toast('Collection created', 'success');
        return newCollection.id;
      };

      const updateCollection = (id, updates) => {
        const updated = collections.map(c => c.id === id ? { ...c, ...updates } : c);
        setCollections(updated);
        saveData('collections', updated);
      };

      const deleteCollection = (id) => {
        // Don't allow deleting curated collections
        const collection = collections.find(c => c.id === id);
        if (collection?.collectionType === 'curated') {
          toast('Cannot delete curated collections', 'error');
          return;
        }
        const updated = collections.filter(c => c.id !== id);
        setCollections(updated);
        saveData('collections', updated);
        toast('Collection deleted', 'success');
      };

      const addRecipeToCollection = (recipeId, collectionId) => {
        // Don't allow adding to curated collections manually
        const collection = collections.find(c => c.id === collectionId) || CURATED_COLLECTIONS.find(c => c.id === collectionId);
        if (collection?.collectionType === 'curated') {
          toast('Curated collections update automatically', 'error');
          return;
        }
        const updated = collections.map(c => {
          if (c.id === collectionId && !c.recipeIds.includes(recipeId)) {
            return { ...c, recipeIds: [...c.recipeIds, recipeId] };
          }
          return c;
        });
        setCollections(updated);
        saveData('collections', updated);
        toast('Added to collection', 'success');
      };

      const removeRecipeFromCollection = (recipeId, collectionId) => {
        const updated = collections.map(c => {
          if (c.id === collectionId) {
            return { ...c, recipeIds: c.recipeIds.filter(id => id !== recipeId) };
          }
          return c;
        });
        setCollections(updated);
        saveData('collections', updated);
        toast('Removed from collection', 'success');
      };

      const addToInventory = (item) => {
        const barInventory = getActiveBarInventory();
        const canonicalName = normalizeIngredient(item, ingredientsDb);
        if (barInventory.some(i => normalizeIngredient(i.name, ingredientsDb) === canonicalName)) {
          toast('Already in your bar', 'error');
          return;
        }
        // Store with original casing for display, but matching uses canonical name
        const updated = [...barInventory, { id: Date.now(), name: item }];
        updateActiveBarInventory(updated);
        toast(`Added ${item}`, 'success');
      };

      const removeFromInventory = (id) => {
        const barInventory = getActiveBarInventory();
        const updated = barInventory.filter(i => i.id !== id);
        updateActiveBarInventory(updated);
      };

      // Bar management functions
      const createBar = (name) => {
        const newBar = {
          id: `bar-${Date.now()}`,
          name: name.trim(),
          isMain: bars.length === 0, // First bar is main
          inventory: [],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        const updated = [...bars, newBar];
        saveBars(updated);
        if (bars.length === 0) {
          saveActiveBarId(newBar.id);
        }
        toast('Bar created', 'success');
        return newBar;
      };

      const updateBar = (id, updates) => {
        const updated = bars.map(b => {
          if (b.id === id) {
            return { ...b, ...updates, updatedAt: new Date().toISOString() };
          }
          return b;
        });
        saveBars(updated);
        toast('Bar updated', 'success');
      };

      const deleteBar = (id) => {
        if (bars.length <= 1) {
          toast('Cannot delete the last bar', 'error');
          return;
        }
        const updated = bars.filter(b => b.id !== id);
        saveBars(updated);
        
        // Switch to main bar or first available if deleted bar was active
        if (activeBarId === id) {
          const mainBar = updated.find(b => b.isMain) || updated[0];
          saveActiveBarId(mainBar.id);
        }
        toast('Bar deleted', 'success');
      };

      const setMainBar = (id) => {
        // Only one bar can be main
        const updated = bars.map(b => ({
          ...b,
          isMain: b.id === id,
          updatedAt: b.id === id ? new Date().toISOString() : b.updatedAt
        }));
        saveBars(updated);
        toast('Main bar updated', 'success');
      };

      const duplicateBar = (id) => {
        const barToDuplicate = bars.find(b => b.id === id);
        if (!barToDuplicate) return;
        
        const newBar = {
          id: `bar-${Date.now()}`,
          name: `${barToDuplicate.name} (Copy)`,
          isMain: false,
          inventory: JSON.parse(JSON.stringify(barToDuplicate.inventory)), // Deep copy
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        const updated = [...bars, newBar];
        saveBars(updated);
        toast('Bar duplicated', 'success');
        return newBar;
      };

      // Random cocktail
      const pickRandom = () => {
        const drinks = displayDrinks;
        if (drinks.length === 0) return;
        const random = drinks[Math.floor(Math.random() * drinks.length)];
        setSelectedDrink(random);
      };

      // Filtered & sorted drinks
      const displayDrinks = useMemo(() => {
        if (!getAllDrinks) return [];
        let drinks = getAllDrinks();
        
        // Get to_try collection IDs
        const toTryCollection = (collections || []).find(c => c.id === 'to_try');
        const toTryIds = new Set(toTryCollection?.recipeIds || []);
        
        if (view === 'keepers') {
          drinks = drinks.filter(d => keepers && keepers.has ? keepers.has(d.id) : false);
        } else if (view === 'toTry') {
          drinks = drinks.filter(d => toTryIds.has(d.id));
        }
        else if (view === 'canMake') drinks = drinks.filter(d => canMakeDrink(d));
        else if (view === 'almostMake') drinks = drinks.filter(d => {
          const missing = getMissingCount(d);
          return missing > 0 && missing <= 2 && !canMakeDrink(d);
        });
        else if (view === 'custom') drinks = drinks.filter(d => d.source === 'custom');
        
        if (searchTerm.trim()) {
          const term = searchTerm.toLowerCase();
          drinks = drinks.filter(d => {
            const nameMatch = d.name.toLowerCase().includes(term);
            const ingredientMatch = d.ingredients?.some(i => i.name.toLowerCase().includes(term));
            const noteMatch = userRecipeNotes[d.id]?.toLowerCase().includes(term);
            const taxonomyMatch = [
              d.primary_family,
              d.primary_template,
              d.secondary_template,
              d.build_method,
              d.service_style,
              d.base_spirit,
              d.classification_note,
              ...getRecipeTaxonomyTags(d)
            ].filter(Boolean).some(value => String(value).toLowerCase().includes(term));
            return nameMatch || ingredientMatch || noteMatch || taxonomyMatch;
          });
        }
        
        // Apply multi-filters
        if (filters.spirits.length > 0) {
          drinks = drinks.filter(d => filters.spirits.includes(detectSpirit(d)));
        }
        
        if (filters.families.length > 0) {
          drinks = drinks.filter(d => d.primary_family && filters.families.includes(d.primary_family));
        }
        
        if (filters.methods.length > 0) {
          drinks = drinks.filter(d => {
            const method = detectMethod(d);
            return method && filters.methods.includes(method);
          });
        }
        
        if (filters.glasses.length > 0) {
          drinks = drinks.filter(d => d.glass && filters.glasses.includes(d.glass));
        }
        
        // Filter by template
        if (filters.templates.length > 0) {
          drinks = drinks.filter(d => {
            const drinkTemplates = [d.primary_template, d.secondary_template].filter(Boolean);
            return drinkTemplates.some(template => filters.templates.includes(template));
          });
        }
        
        // Filter by taxonomy tags (experience / occasion / structural)
        if (filters.tags.length > 0) {
          const specialTags = ['canMake', 'almostMake', 'keepers', 'toTry'];
          const regularTags = filters.tags.filter(t => !specialTags.includes(t));
          
          if (regularTags.length > 0) {
            drinks = drinks.filter(d => {
              const drinkTags = getRecipeTaxonomyTags(d);
              return regularTags.some(tag => drinkTags.includes(tag));
            });
          }
        }
        
        // Special tag filters (not part of recipe tags)
        if (filters.tags.includes('canMake')) {
          drinks = drinks.filter(d => canMakeDrink(d));
        }
        if (filters.tags.includes('almostMake')) {
          drinks = drinks.filter(d => {
            const missing = getMissingCount(d);
            return missing > 0 && missing <= 2 && !canMakeDrink(d);
          });
        }
        if (filters.tags.includes('keepers')) {
          drinks = drinks.filter(d => keepers && keepers.has ? keepers.has(d.id) : false);
        }
        if (filters.tags.includes('toTry')) {
          drinks = drinks.filter(d => toTryIds.has(d.id));
        }
        
        // Sort
        drinks = [...drinks].sort((a, b) => {
          if (sortBy === 'newest') {
            const aDate = a.dateAdded ? new Date(a.dateAdded) : new Date(0);
            const bDate = b.dateAdded ? new Date(b.dateAdded) : new Date(0);
            return bDate - aDate;
          }
          if (sortBy === 'most-made') {
            return (madeCounts[b.id] || 0) - (madeCounts[a.id] || 0);
          }
          if (sortBy === 'ingredients') return (a.ingredients?.length || 0) - (b.ingredients?.length || 0);
          return a.name.localeCompare(b.name);
        });
        
        return drinks;
      }, [view, curatedDrinks, customDrinks, keepers, collections, bars, activeBarId, ingredientsDb, searchTerm, filters, sortBy, madeCounts, canMakeDrink, getMissingCount, userRecipeNotes]);
      
      const toggleFilter = (category, value) => {
        setFilters(prev => {
          const newFilters = { ...prev };
          if (newFilters[category].includes(value)) {
            newFilters[category] = newFilters[category].filter(v => v !== value);
          } else {
            newFilters[category] = [...newFilters[category], value];
          }
          return newFilters;
        });
      };
      
      const clearFilters = () => {
        setFilters(buildFilterState());
        setSearchTerm('');
      };
      const openBrowseWith = ({ mode = 'recipes', lens = 'structure', filters: presetFilters = null } = {}) => {
        setBrowseMode(mode);
        setBrowseLens(mode === 'ingredients' ? 'structure' : lens);
        setFilters(presetFilters ? buildFilterState(presetFilters) : buildFilterState());
        setFiltersExpanded(false);
        setSearchTerm('');
        setView('browse');
      };
      const applyBrowsePreset = (payload = {}, lens = browseLens, replace = true) => {
        setBrowseMode('recipes');
        setBrowseLens(lens);
        setFilters(prev => replace ? buildFilterState(payload) : mergeFilterState(prev, payload));
        setSearchTerm('');
        setFiltersExpanded(false);
      };
      
      const hasActiveFilters = filters.spirits.length > 0 || filters.families.length > 0 || filters.methods.length > 0 || filters.glasses.length > 0 || filters.tags.length > 0 || filters.templates.length > 0 || searchTerm.trim();
      const activeFilterCount = filters.spirits.length + filters.families.length + filters.methods.length + filters.glasses.length + filters.tags.length + filters.templates.length;
      const allDrinks = useMemo(() => getAllDrinks(), [curatedDrinks, customDrinks]);
      
      // Get unique glass types from all drinks
      const availableGlasses = useMemo(() => {
        const glassesSet = new Set();
        allDrinks.forEach(drink => {
          if (drink.glass) glassesSet.add(drink.glass);
        });
        return Array.from(glassesSet).sort();
      }, [allDrinks]);

      const availableFamilies = useMemo(() => {
        const familySet = new Set();
        allDrinks.forEach(drink => {
          if (drink.primary_family) familySet.add(drink.primary_family);
        });
        return Array.from(familySet).sort();
      }, [allDrinks]);

      // Get unique templates from all drinks
      const availableTemplates = useMemo(() => {
        const templatesSet = new Set();
        allDrinks.forEach(drink => {
          if (drink.primary_template) templatesSet.add(drink.primary_template);
          if (drink.secondary_template) templatesSet.add(drink.secondary_template);
        });
        return Array.from(templatesSet).sort();
      }, [allDrinks]);
      const availableExperienceTags = useMemo(() => {
        const tags = new Set();
        allDrinks.forEach(drink => inferExperienceTags(drink, drink.primary_family, drink.citrus_present, drink.lengthened).forEach(tag => tags.add(tag)));
        return Array.from(tags).sort();
      }, [allDrinks]);
      const availableOccasionTags = useMemo(() => {
        const tags = new Set();
        allDrinks.forEach(drink => inferOccasionTags(drink).forEach(tag => tags.add(tag)));
        return Array.from(tags).sort();
      }, [allDrinks]);
      const availableStructuralTags = useMemo(() => {
        const tags = new Set();
        allDrinks.forEach(drink => inferStructuralTags(drink, drink.citrus_present, drink.lengthened).forEach(tag => tags.add(tag)));
        return Array.from(tags).sort();
      }, [allDrinks]);
      const familyBrowseCards = useMemo(() => {
        return PRIMARY_FAMILY_OPTIONS.map(family => {
          const matching = allDrinks.filter(drink => drink.primary_family === family);
          const templateCounts = {};
          matching.forEach(drink => {
            [drink.primary_template, drink.secondary_template].filter(Boolean).forEach(template => {
              templateCounts[template] = (templateCounts[template] || 0) + 1;
            });
          });
          const topTemplates = Object.entries(templateCounts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(([template]) => template);
          return {
            family,
            count: matching.length,
            samples: matching.slice(0, 3).map(drink => drink.name),
            topTemplates: topTemplates.length > 0 ? topTemplates : (FAMILY_REFERENCE[family]?.templates || [])
          };
        }).filter(card => card.count > 0);
      }, [allDrinks]);
      const templateBrowseCards = useMemo(() => {
        const counts = {};
        allDrinks.forEach(drink => {
          [drink.primary_template, drink.secondary_template].filter(Boolean).forEach(template => {
            if (!counts[template]) {
              counts[template] = { template, count: 0, families: new Set(), samples: [] };
            }
            counts[template].count += 1;
            if (drink.primary_family) counts[template].families.add(drink.primary_family);
            if (counts[template].samples.length < 3 && !counts[template].samples.includes(drink.name)) {
              counts[template].samples.push(drink.name);
            }
          });
        });
        return Object.values(counts)
          .map(entry => ({
            ...entry,
            family: Array.from(entry.families)[0] || '',
            families: Array.from(entry.families)
          }))
          .sort((a, b) => b.count - a.count || a.template.localeCompare(b.template))
          .slice(0, 18);
      }, [allDrinks]);
      const experienceBrowseCards = useMemo(() => {
        return EXPERIENCE_PATHS.map(path => ({
          ...path,
          count: allDrinks.filter(drink => drinkMatchesFilterPayload(drink, path.filters)).length
        })).filter(path => path.count > 0);
      }, [allDrinks]);
      const activeBrowseLens = BROWSE_LENSES.find(lens => lens.id === browseLens) || BROWSE_LENSES[0];
      const activeFilterPills = [
        ...filters.families.map(value => ({ group: 'families', value, label: value })),
        ...filters.templates.map(value => ({ group: 'templates', value, label: value })),
        ...filters.spirits.map(value => ({ group: 'spirits', value, label: value })),
        ...filters.methods.map(value => ({ group: 'methods', value, label: value })),
        ...filters.glasses.map(value => ({ group: 'glasses', value, label: value })),
        ...filters.tags.map(value => ({ group: 'tags', value, label: value }))
      ];

      const getAlmostMakeCount = () => {
        return getAllDrinks().filter(d => {
          const missing = getMissingCount(d);
          return missing > 0 && missing <= 2 && !canMakeDrink(d);
        }).length;
      };

      const navItems = [
        { id: 'home', label: 'Mix', icon: 'Home' },
        { id: 'bars', label: 'Bar', icon: 'Wine' },
        { id: 'library', label: 'Discover', icon: 'BookOpen' },
        { id: 'settings', label: 'Settings', icon: 'Settings' },
      ];

      return (
        <div className="min-h-screen flex flex-col pb-16 sm:pb-0 bg-ink-950">
          {/* Desktop Header */}
          <header className="hidden sm:block sticky top-0 z-40 bg-ink-950 border-b border-ink-700">
            <div className="max-w-6xl mx-auto px-6">
              <div className="flex items-center justify-between h-16">
                <h1 className="text-2xl font-bold text-ink-100">Barkeep</h1>
                <div className="flex items-center gap-1">
                  {/* Theme Toggle */}
                  <button
                    onClick={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')}
                    className="p-2 text-ink-500 hover:text-ink-300"
                    title={`Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`}
                  >
                    <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4" />
                  </button>
                  {view === 'browse' && (
                    <button onClick={() => setShowAddDrink(true)} className="p-2 text-ink-500 hover:text-ink-300" title="New Recipe">
                      <Icon name="Plus" className="w-4 h-4" />
                    </button>
                  )}
                </div>
              </div>
              {(view !== 'home' && view !== 'settings' && view !== 'bars' && view !== 'library' && view !== 'manageBars' && view !== 'inventory' && view !== 'browse') && (
                <nav className="flex gap-1 pb-3">
                  {navItems.map(item => (
                    <button
                      key={item.id}
                      onClick={() => {
                        setView(item.id);
                        if (item.id === 'browse') {
                          setSearchTerm('');
                        }
                      }}
                      className={`flex items-center gap-2 px-3 py-2 text-sm ${
                        view === item.id ? 'text-ink-100 font-bold' : 'text-ink-500 hover:text-ink-300'
                      }`}
                    >
                      <Icon name={item.icon} className="w-4 h-4" />
                      <span>{item.label}</span>
                      {item.count > 0 && (
                        <span className={`text-2xs px-1.5 py-0.5  ${view === item.id ? 'bg-copper/20 text-copper' : 'bg-transparent text-ink-500'}`}>
                          {item.count}
                        </span>
                      )}
                    </button>
                  ))}
                </nav>
              )}
            </div>
          </header>

          {/* Mobile Header */}
          <header className="sm:hidden sticky top-0 z-40 bg-ink-950 border-b border-ink-700">
            <div className="flex items-center justify-between px-4 h-14">
              {(view === 'home' || view === 'settings' || view === 'bars' || view === 'library' || view === 'manageBars' || view === 'inventory') ? (

            return invCanonical.has(ingCanonical);
          }) || false;
          
          if (!currentlyCanMake && drink.ingredients) {
            // Find missing ingredients
            drink.ingredients.forEach(ing => {
              const ingCanonical = normalizeIngredient(ing.name, ingredientsDb);
              if (!invCanonical.has(ingCanonical)) {
                // Check if adding this ingredient would make this drink makeable
                const wouldMake = drink.ingredients.every(ing2 => {
                  const ing2Canonical = normalizeIngredient(ing2.name, ingredientsDb);
                  return invCanonical.has(ing2Canonical) || ing2Canonical === ingCanonical;
                });
                
                if (wouldMake) {
                  const key = ingCanonical;
                  if (!ingredientImpact[key]) {
                    ingredientImpact[key] = {
                      name: ing.name,
                      canonical: ingCanonical,
                      recipes: []
                    };
                  }
                  // Avoid duplicate recipes
                  if (!ingredientImpact[key].recipes.find(r => r.id === drink.id)) {
                    ingredientImpact[key].recipes.push({
                      id: drink.id,
                      name: drink.name
                    });
                  }
                }
              }
            });
          }
        });
        
        // Convert to array and sort by recipe count
        return Object.values(ingredientImpact)
          .map(item => ({
            name: item.name,
            count: item.recipes.length,
            recipes: item.recipes
          }))
          .sort((a, b) => b.count - a.count)
          .slice(0, 20); // Top 20 gateway bottles
      }, [getAllDrinks, canMakeDrink, ingredientsDb, getActiveBarInventory, normalizeIngredient]);

      return (
        <div className="max-w-2xl mx-auto">
          <div className="mb-6">
            <h2 className="font-display text-2xl text-ink-100 font-light mb-1">Gateway Bottles</h2>
            <p className="text-ink-500 text-sm">Adding one of these would unlock new recipes</p>
          </div>

          {gatewayBottles.length === 0 ? (
            <div className="text-center py-16">
              <p className="text-ink-400 font-light">No gateway bottles found</p>
              <p className="text-ink-600 text-sm mt-1">You can make all available recipes</p>
            </div>
          ) : (
            <div className="bg-transparent border border-ink-700 overflow-hidden">
              {gatewayBottles.map((item) => (
                <div
                  key={item.name}
                  className="py-3 px-4 border-b border-ink-700 transition-colors last:border-0 group"
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <button
                          onClick={() => {
                            if (onSelectIngredient) {
                              onSelectIngredient(item.canonical);
                            }
                          }}
                          className="font-display text-base text-ink-100 font-medium text-copper hover:text-copper/80 transition-colors text-left"
                        >
                          {item.name}
                        </button>
                        <span className="text-2xs px-2 py-0.5 bg-copper/20 text-copper border border-copper/30 font-medium">
                          {item.count} {item.count === 1 ? 'recipe' : 'recipes'}
                        </span>
                      </div>
                      <p className="text-ink-600 text-xs font-light line-clamp-1">
                        {item.recipes.slice(0, 5).map(r => r.name).join(' · ')}
                        {item.recipes.length > 5 && ' · ...'}
                      </p>
                    </div>
                    {onAdd && (
                      <button
                        onClick={() => onAdd(item.name)}
                        className="px-3 py-1.5 text-xs text-copper hover:text-copper border border-copper/30 copper/50 transition-colors flex-shrink-0"

    const IngredientsBrowseView = ({ ingredientsDb, allDrinks, normalizeIngredient, searchTerm, onSelectIngredient, isIngredientInToTry }) => {
      // Flatten all ingredients from the database
      const allIngredients = useMemo(() => {
        if (!ingredientsDb?.categories) return [];
        const flat = [];
        ingredientsDb.categories.forEach(cat => {
          cat.subcategories?.forEach(sub => {
            sub.items?.forEach(item => {
              flat.push({
                ...item,
                category: cat.name,
                subcategory: sub.name,
                canonicalName: normalizeIngredient(item.name, ingredientsDb)
              });
            });
          });
        });
        return flat;
      }, [ingredientsDb, normalizeIngredient]);

      // Filter ingredients by search term
      const filteredIngredients = useMemo(() => {
        if (!searchTerm.trim()) return allIngredients;
        const term = searchTerm.toLowerCase().trim();
        return allIngredients.filter(ing => {
          const nameMatch = ing.name.toLowerCase().includes(term);
          const aliasMatch = ing.aliases?.some(a => a.toLowerCase().includes(term));
          const categoryMatch = ing.category?.toLowerCase().includes(term);
          const subcategoryMatch = ing.subcategory?.toLowerCase().includes(term);
          return nameMatch || aliasMatch || categoryMatch || subcategoryMatch;
        });
      }, [allIngredients, searchTerm]);

      // Count recipes for each ingredient
      const ingredientsWithCounts = useMemo(() => {
        return filteredIngredients.map(ing => {
          const count = allDrinks.filter(drink => {
            return drink.ingredients?.some(drinkIng => {
              const drinkIngCanonical = normalizeIngredient(drinkIng.name, ingredientsDb);
              return drinkIngCanonical === ing.canonicalName;
            });
          }).length;
          return { ...ing, recipeCount: count };
        });
      }, [filteredIngredients, allDrinks, ingredientsDb, normalizeIngredient]);

      // Sort by name
      const sortedIngredients = useMemo(() => {
        return [...ingredientsWithCounts].sort((a, b) => a.name.localeCompare(b.name));
      }, [ingredientsWithCounts]);

      if (!ingredientsDb) {
        return (
          <div className="py-8 text-center text-ink-500">
            Loading ingredients...
          </div>
        );
      }

      return (
        <div>
          {/* Results count */}
          <div className="mb-4">
            <p className="text-xs text-ink-600 tracking-wide">
              {sortedIngredients.length} {sortedIngredients.length === 1 ? 'ingredient' : 'ingredients'}
            </p>
          </div>

          {/* Ingredients List */}
          {sortedIngredients.length === 0 ? (
            <div className="py-8 text-center text-ink-500">
              No ingredients found
            </div>
          ) : (
            <div className="bg-transparent overflow-hidden">
              {sortedIngredients.map((ingredient, i) => (
                <button
                  key={ingredient.id || `${ingredient.category}-${ingredient.subcategory}-${i}`}
                  onClick={() => onSelectIngredient(ingredient.canonicalName)}
                  className="w-full text-left py-3 px-4 border-b border-ink-700 last:border-0 bg-transparent hover:bg-ink-800 transition-colors cursor-pointer group"
                >
                  <div className="flex items-start gap-4">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <h3 className="text-base font-bold text-ink-100 uppercase">
                          {ingredient.name}
                        </h3>
                        {isIngredientInToTry && isIngredientInToTry(ingredient.canonicalName) && (
                          <Icon name="Bookmark" className="w-4 h-4 text-copper flex-shrink-0" />
                        )}
                      </div>
                      <div className="text-xs text-ink-500">
                        {ingredient.category}
                        {ingredient.subcategory && ` · ${ingredient.subcategory}`}
                      </div>
                    </div>
                    <div className="ml-4 text-right flex-shrink-0">
                      <div className="text-sm font-medium text-ink-300">
                        {ingredient.recipeCount}
                      </div>
                      <div className="text-xs text-ink-600">
                        {ingredient.recipeCount === 1 ? 'recipe' : 'recipes'}
                      </div>
                    </div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      );

    const IngredientDetailView = ({ ingredient, allDrinks, ingredientsDb, normalizeIngredient, onNavigateToRecipe, onClose, isInToTry, onToggleToTry }) => {
      // Find ingredient details from ingredientsDb
      let ingredientDetails = null;
      let category = '';
      let subcategory = '';

      if (ingredientsDb?.categories) {
        for (const cat of ingredientsDb.categories) {
          for (const sub of cat.subcategories || []) {
            for (const item of sub.items || []) {
              const canonical = normalizeIngredient(item.name, ingredientsDb);
              if (canonical === ingredient ||
                  item.aliases?.some(alias => normalizeIngredient(alias, ingredientsDb) === ingredient)) {
                ingredientDetails = item;
                category = cat.name;
                subcategory = sub.name;
                break;
              }
            }
            if (ingredientDetails) break;
          }
          if (ingredientDetails) break;
        }

      // Find all cocktails that use this ingredient
      const cocktailsUsingIngredient = allDrinks.filter(drink => {

          const ingCanonical = normalizeIngredient(ing.name, ingredientsDb);

                    <hr className="border-ink-700" />
                  </>
                )}

                <div>
                  <div className="space-y-2">
                    {cocktailsUsingIngredient.map(drink => (
                      <div key={drink.id} className="py-1 border-b border-ink-700 last:border-0">
                        <button

    const IngredientMatchingModal = ({ currentIngredient, currentIndex, totalCount, suggestions, onSelect, onSkip, onPrevious, onCustomInput, ingredientsDb, allIngredients }) => {
      const [customInput, setCustomInput] = useState('');
      const [showCustomInput, setShowCustomInput] = useState(false);
      const [customSuggestions, setCustomSuggestions] = useState([]);
      
      // Determine if there's an exact match (score 100)
      const hasExactMatch = suggestions && suggestions.length > 0 && suggestions[0].score === 100;

      useEffect(() => {
        if (customInput.length >= 2) {
          const filtered = allIngredients
            .filter(ing => {
              const nameMatch = ing.name.toLowerCase().includes(customInput.toLowerCase());
              const aliasMatch = ing.aliases?.some(a => a.toLowerCase().includes(customInput.toLowerCase()));
              return (nameMatch || aliasMatch) && !ing.isAlias;
            })
            .slice(0, 8)
            .map(ing => ing.name);
          setCustomSuggestions(filtered);
        } else {
          setCustomSuggestions([]);
        }
      }, [customInput, allIngredients]);

      const handleCustomSubmit = () => {
        if (customInput.trim()) {
          onCustomInput(customInput.trim());
          setCustomInput('');
          setShowCustomInput(false);
        }
      };

      if (!currentIngredient) return null;

      return (
        <div className="fixed inset-0 z-[70] bg-ink-950/95 flex items-center justify-center p-4" onClick={(e) => e.stopPropagation()}>
          <div className="max-w-lg w-full bg-ink-900 border-2 border-copper/50 shadow-2xl p-6" onClick={(e) => e.stopPropagation()}>
            <div className="mb-6">
              <div className="flex items-center justify-between mb-2">
                <h3 className="font-display text-xl text-ink-100 font-light">Match Ingredient</h3>
                <span className="text-sm text-ink-500">{currentIndex + 1} of {totalCount}</span>
              </div>
              <p className="text-sm text-ink-400 mb-4">Extracted: <span className="text-ink-200 font-medium">{currentIngredient.originalName}</span></p>
              {currentIngredient.amount && (
                <p className="text-xs text-ink-500">Measure: <span className="text-ink-300 font-medium">{currentIngredient.amount} {currentIngredient.unit}</span></p>
              )}
            </div>

            {!showCustomInput ? (
              <>
                {suggestions.length > 0 ? (
                  <div className="mb-4">
                    <p className="text-xs text-ink-500 uppercase tracking-wider mb-2">
                      {hasExactMatch ? '✓ Exact Match' : 'Suggestions'}
                    </p>
                    <div className="space-y-2">
                      {suggestions.map((suggestion, idx) => {
                        const isExact = suggestion.score === 100;
                        const isAlias = suggestion.score === 95;
                        const isPartial = suggestion.score >= 70 && suggestion.score < 95;
                        
                        return (
                          <button
                            key={idx}
                            onClick={() => onSelect(suggestion.name || suggestion)}
                            className={`w-full text-left px-4 py-3 border transition-colors ${
                              isExact 
                                ? 'bg-emerald-900/30 border-emerald-700/50 hover:bg-emerald-900/40 hover:border-emerald-600/70 text-emerald-200'
